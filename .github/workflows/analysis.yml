name: Paired analysis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-analysis.txt
      - name: Check out pinned native kernel for CPU adapter controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: noteflowai/vla-update-certification
          ref: ac10e2e5ef8a0cf1ba4b3c60011cc42110349db2
          path: .native-kernel
          persist-credentials: false
      - run: python -m unittest discover -s tests -v
        env:
          NATIVE_KERNEL_ROOT: ${{ github.workspace }}/.native-kernel
      - name: Check retained preprint and outcome archive identities
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("paper/revision-20261001")
          for manifest, archive, field in (
              ("arxiv-manifest.json", "arxiv.tar.gz", "archive_sha256"),
              ("reproducibility-manifest.json", "reproducibility.tar.gz", "archive_sha256"),
          ):
              expected = json.loads((root / manifest).read_text())[field]
              assert hashlib.sha256((root / archive).read_bytes()).hexdigest() == expected
          source = json.loads((root / "arxiv-manifest.json").read_text())
          assert hashlib.sha256((root / "output/pdf/higher-success-new-failures.pdf").read_bytes()).hexdigest() == source["reviewed_pdf_sha256"]
          PY
      - name: Reproduce analysis and figures from the extracted outcome archive
        run: python paper/revision-20261001/verify_reproducibility.py
