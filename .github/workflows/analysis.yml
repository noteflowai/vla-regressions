name: Paired analysis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -s tests -v
      - name: Check retained preprint and outcome archive identities
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("paper/revision-20261001")
          for manifest, archive, field in (
              ("arxiv-manifest.json", "arxiv.tar.gz", "archive_sha256"),
              ("reproducibility-manifest.json", "reproducibility.tar.gz", "archive_sha256"),
          ):
              expected = json.loads((root / manifest).read_text())[field]
              assert hashlib.sha256((root / archive).read_bytes()).hexdigest() == expected
          PY
